name: CI

on:
  push:
    branches: ['**'] # Tags run the release workflow, which verifies before publishing.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Public default identity: ignore any local config.
      VERBATIM_LOCAL_ENV: /nonexistent
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      # setup_local_sensevoice.sh downloads about 246 MB and checks pinned
      # SHA-256 digests, so a stale or corrupt cache entry is re-downloaded.
      - name: Cache SenseVoice downloads
        uses: actions/cache@v4
        with:
          path: .build/downloads
          key: sensevoice-${{ hashFiles('scripts/setup_local_sensevoice.sh') }}

      - name: Voices available to the smoke test
        run: say -v '?' | grep -i 'zh_' || echo "no zh voice preinstalled"

      - name: Verify
        run: scripts/verify.sh

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      - name: Install XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -xk "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/totype-tools"
          echo "$RUNNER_TEMP/totype-tools/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify iOS shared behavior and native targets
        run: scripts/verify-ios.sh

      - name: Keep the native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: VerbatimVoiceMobile/.build/ci-ios-build.log
          if-no-files-found: ignore
          retention-days: 7
