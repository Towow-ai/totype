name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERBATIM_LOCAL_ENV: /nonexistent
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      - name: Build dmg
        run: scripts/make-dmg.sh dist

      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          VERSION="$(ls dist/Totype-*-arm64.dmg | sed -E 's#.*/Totype-(.*)-arm64\.dmg#\1#')"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match app version ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$VERSION" > dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Totype-${VERSION}-arm64.dmg" dist/SHA256SUMS \
            --title "Totype ${VERSION}" \
            --notes-file dist/notes.md \
            --verify-tag \
            $PRERELEASE
